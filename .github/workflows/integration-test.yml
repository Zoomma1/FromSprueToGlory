name: From Sprue To Glory integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_backend:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4
      - name: Run backend test and build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json
      - run: npm ci
        working-directory: ./server
      - name: Run lint
        run: npm run lint
        working-directory: ./server
      - name: Run tests
        run: npm run test
        working-directory: ./server
      - name: Build the app
        run: npm run build --if-present
        working-directory: ./server

  run_frontend_test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4
      - name: Run frontend test and build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json
      - run: npm ci
        working-directory: ./client
      - name: Run lint
        run: npx ng lint
        working-directory: ./client
      - name: Run tests
        run: npm run test -- --browsers=ChromeHeadless --watch=false
        working-directory: ./client
      - name: Build the app
        run: npx ng build
        working-directory: ./client

  security_audit:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client
      - name: Audit production dependencies (client)
        run: npm audit --omit=dev
        working-directory: ./client
      - name: Audit all dependencies (client - warning only)
        run: npm audit || true
        working-directory: ./client
      - name: Install server dependencies
        run: npm ci
        working-directory: ./server
      - name: Audit production dependencies (server)
        run: npm audit --omit=dev
        working-directory: ./server
      - name: Audit all dependencies (server - warning only)
        run: npm audit || true
        working-directory: ./server
