name: From Sprue To Glory integration tests

on:
  push:
    branches: [ "production", "staging" ]
  pull_request:
    branches: [ "production", "staging" ]

jobs:
  build_backend:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: echo "DATABASE_URL=postgresql://user:password@localhost:5432/db" > .env
        working-directory: ./server
      - name: Run backend test and build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json
      - run: npm ci
        working-directory: ./server
      - run: npx prisma generate
        working-directory: ./server
      - name: Run lint
        run: npm run lint
        working-directory: ./server
      - name: Run tests
        run: npm run test
        working-directory: ./server
      - name: Build the app
        run: npm run build --if-present
        working-directory: ./server

  run_frontend_test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4
      - name: Run frontend test and build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json
      - run: npm ci
        working-directory: ./client
      - name: Run lint
        run: npx ng lint
        working-directory: ./client
      - name: Run tests
        run: npm run test -- --browsers=ChromeHeadless --watch=false
        working-directory: ./client
      - name: Build the app
        run: npx ng build
        working-directory: ./client

  security_audit:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: ./client
      - name: Audit production dependencies (client)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: ./client
      - name: Audit all dependencies (client - warning only)
        run: npm audit || true
        working-directory: ./client
      - name: Install server dependencies
        run: npm ci
        working-directory: ./server
      - name: Audit production dependencies (server)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: ./server
      - name: Audit all dependencies (server - warning only)
        run: npm audit || true
        working-directory: ./server

  notify:
    runs-on: ubuntu-latest
    needs: [build_backend, run_frontend_test, security_audit]
    if: always()

    steps:
      - name: Send Telegram notification
        run: |
          STATUS=${{ needs.build_backend.result == 'success' && needs.run_frontend_test.result == 'success' && needs.security_audit.result == 'success' && 'success' || 'failure' }}
          curl -X POST https://ec2c-89-29-46-248.ngrok-free.app/webhook/f5fd20f1-7cda-4ecb-ac1f-aa97fe33c352 \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$STATUS\",\"branch\":\"${{ github.ref_name }}\",\"commit\":\"${{ github.sha }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
