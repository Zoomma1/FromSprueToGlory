<div class="searchable-wrapper" [class.is-disabled]="isDisabled()">
  <label class="field-label">{{ label() }}</label>
  <div class="field-input-wrapper">
    <input class="field-input"
      [matAutocomplete]="auto"
      [value]="inputDisplayValue()"
      (input)="onInput($any($event.target).value)"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()">
    @if (internalValue()) {
      <button class="clear-btn" type="button" (click)="clear()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>
  <mat-autocomplete #auto="matAutocomplete"
    [displayWith]="autocompleteDisplayFn"
    (optionSelected)="onSelectionChange($event.option.value)"
    (closed)="onClosed()">
    @if (nullOptionLabel()) {
      <mat-option [value]="null">{{ nullOptionLabel() }}</mat-option>
    }
    @if (filteredOptions().length === 0) {
      <mat-option disabled>No results</mat-option>
    }
    @for (option of filteredOptions(); track $index) {
      <mat-option [value]="option">{{ displayFn()(option) }}</mat-option>
    }
  </mat-autocomplete>
</div>
