<!-- Mobile hamburger -->
@if (isMobile() && authService.isLoggedIn()) {
<button class="mobile-menu-btn" (click)="toggleSidenav()" aria-label="Toggle menu">
  <mat-icon>menu</mat-icon>
</button>
}

@if (authService.isLoggedIn()) {
<div class="app-layout">

  <!-- Mobile overlay -->
  @if (isMobile() && sidenavOpen()) {
  <div class="sidenav-overlay" (click)="onNavClick()"></div>
  }

  <!-- Sidebar -->
  <aside class="app-sidenav" [class.sidenav--open]="!isMobile() || sidenavOpen()">

    <div class="sidenav-brand">
      <span class="brand-name">From Sprue to Glory</span>
    </div>

    <nav class="sidenav-nav">
      @for (item of navItems; track item.route) {
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="nav-item--active" (click)="onNavClick()">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
      }
    </nav>

    <div class="sidenav-footer">
      <button class="footer-btn" (click)="authService.logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content" [class.main-content--shifted]="!isMobile()">
    <div class="content-wrapper">
      <router-outlet />
    </div>
  </main>

</div>
} @else {
<div class="content-wrapper auth-page">
  <router-outlet />
</div>
}
