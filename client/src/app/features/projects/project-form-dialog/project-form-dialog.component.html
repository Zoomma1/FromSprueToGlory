<h2 mat-dialog-title class="dialog-title">{{ data.mode === 'create' ? 'New Project' : 'Edit Project' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <div class="field-group">
      <label for="project-name" class="field-label">Project Name</label>
      <input id="project-name" class="field-input" formControlName="name" placeholder="Enter identifier...">
    </div>
    <div class="field-group">
      <label for="project-description" class="field-label">Description</label>
      <textarea id="project-description" class="field-input field-textarea" formControlName="description" rows="3"
                placeholder="Mission objectives & specifications..."></textarea>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-cancel" mat-dialog-close>Cancel</button>
  <button class="btn-save" (click)="save()" [disabled]="form.invalid || saving()">
    {{ data.mode === 'create' ? 'Create' : 'Save' }}
  </button>
</mat-dialog-actions>
