<div class="page-header">
    <h1 class="page-title">Pile of Shame</h1>
    <button class="fab-add" (click)="openCreateDialog()" matTooltip="Add item">
        <mat-icon>add</mat-icon>
    </button>
</div>

<!-- Filters -->
<div class="filters-bar">
    <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Status</mat-label>
        <mat-select [(value)]="statusFilter" (selectionChange)="loadItems()">
            <mat-option value="">All</mat-option>
            @for (s of statuses; track s) {
            <mat-option [value]="s">{{ statusLabels[s] }}</mat-option>
            }
        </mat-select>
    </mat-form-field>
</div>

<!-- Items -->
<div class="cards-grid">
    @for (item of items(); track item.id) {
    <app-item-card
        [item]="item"
        (statusChange)="onStatusChange($event)"
        (edit)="openEditDialog($event)"
        (duplicate)="duplicateItem($event)"
        (delete)="deleteItem($event)" />
    }
</div>

@if (items().length === 0) {
<div class="empty-state">
    <mat-icon class="empty-icon">inventory_2</mat-icon>
    <h2>No items yet</h2>
    <p>Start tracking your pile by clicking the + button above</p>
</div>
}
