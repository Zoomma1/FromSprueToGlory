<h2 mat-dialog-title class="dialog-title">{{ data.mode === 'create' ? 'Add Item' : 'Edit Item' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">

    <div class="field-group">
      <label for="item-name" class="field-label">Name</label>
      <input id="item-name" class="field-input" formControlName="name" placeholder="Enter unit name...">
    </div>

    <div class="form-row">
      <app-searchable-select
        formControlName="gameSystem"
        [options]="gameSystems()"
        [displayFn]="gameSystemDisplayFn"
        label="Game System"
        (valueChange)="onGameSystemChange($event?.id ?? '')">
      </app-searchable-select>

      <app-searchable-select
        formControlName="faction"
        [options]="factions()"
        [displayFn]="factionDisplayFn"
        label="Faction">
      </app-searchable-select>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label for="item-status" class="field-label">Status</label>
        <select id="item-status" class="field-input field-select" formControlName="status">
          @for (status of ITEM_STATUSES; track status) {
            <option [value]="status.value">{{ status.label }}</option>
          }
        </select>
      </div>

      <div class="field-group">
        <label for="item-quantity" class="field-label">Quantity</label>
        <input id="item-quantity" class="field-input" type="number" formControlName="quantity" min="1">
      </div>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label for="item-price" class="field-label">Price</label>
        <input id="item-price" class="field-input" type="number" formControlName="price" step="0.01">
      </div>

      <div class="field-group">
        <label for="item-currency" class="field-label">Currency</label>
        <select id="item-currency" class="field-input field-select" formControlName="currency">
          @for (cur of CURRENCIES; track cur) {
            <option [value]="cur">{{ cur }}</option>
          }
        </select>
      </div>
    </div>

    <app-searchable-select
      formControlName="project"
      [options]="projects()"
      [displayFn]="projectDisplayFn"
      label="Project (optional)"
      nullOptionLabel="— None —">
    </app-searchable-select>

    <div class="field-group">
      <label for="item-notes" class="field-label">Notes</label>
      <textarea id="item-notes" class="field-input field-textarea" formControlName="notes" rows="3"
                placeholder="Painting notes, assembly tips..."></textarea>
    </div>

    <div class="field-group">
      <label class="field-label" for="item-tag">Tags</label>
      <div class="field-chips">
        <mat-chip-grid #chipGrid>
          @for (tag of tags(); track tag) {
            <mat-chip-row (removed)="removeTag(tag)">
              {{ tag }}
              <button matChipRemove aria-label="Remove tag">✕</button>
            </mat-chip-row>
          }
        </mat-chip-grid>
        <input
          class="chip-input"
          id="item-tag"
          placeholder="Add a tag..."
          [matChipInputFor]="chipGrid"
          [matChipInputSeparatorKeyCodes]="separatorKeyCodes"
          (matChipInputTokenEnd)="onTagInput($event)"
        >
      </div>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <div class="actions-left">
    @if (data.mode === 'edit') {
      <button class="btn-delete" (click)="delete()" [disabled]="deleting()">Delete</button>
    }
  </div>
  <div class="actions-right">
    <button class="btn-cancel" mat-dialog-close>Cancel</button>
    <button class="btn-save" (click)="save()" [disabled]="form.invalid || saving()">
      {{ data.mode === 'create' ? 'Create' : 'Save' }}
    </button>
  </div>
</mat-dialog-actions>
