<h2 mat-dialog-title class="dialog-title">{{ data.mode === 'create' ? 'Add Item' : 'Edit Item' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">

    <div class="field-group">
      <label class="field-label">Name</label>
      <input class="field-input" formControlName="name" placeholder="Enter unit name...">
    </div>

    <div class="form-row">
      <app-searchable-select
        formControlName="gameSystem"
        [options]="gameSystems()"
        [displayFn]="gameSystemDisplayFn"
        label="Game System"
        (valueChange)="onGameSystemChange($event?.id ?? '')">
      </app-searchable-select>

      <app-searchable-select
        formControlName="faction"
        [options]="factions()"
        [displayFn]="factionDisplayFn"
        label="Faction">
      </app-searchable-select>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label class="field-label">Status</label>
        <select class="field-input field-select" formControlName="status">
          @for (status of ITEM_STATUSES; track status) {
            <option [value]="status.value">{{ status.label }}</option>
          }
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">Quantity</label>
        <input class="field-input" type="number" formControlName="quantity" min="1">
      </div>
    </div>

    <div class="form-row">
      <div class="field-group">
        <label class="field-label">Price</label>
        <input class="field-input" type="number" formControlName="price" step="0.01">
      </div>

      <div class="field-group">
        <label class="field-label">Currency</label>
        <select class="field-input field-select" formControlName="currency">
          @for (cur of CURRENCIES; track cur) {
            <option [value]="cur">{{ cur }}</option>
          }
        </select>
      </div>
    </div>

    <app-searchable-select
      formControlName="project"
      [options]="projects()"
      [displayFn]="projectDisplayFn"
      label="Project (optional)"
      nullOptionLabel="— None —">
    </app-searchable-select>

    <div class="field-group">
      <label class="field-label">Notes</label>
      <textarea class="field-input field-textarea" formControlName="notes" rows="3"
                placeholder="Painting notes, assembly tips..."></textarea>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-cancel" mat-dialog-close>Cancel</button>
  <button class="btn-save" (click)="save()" [disabled]="form.invalid || saving()">
    {{ data.mode === 'create' ? 'Create' : 'Save' }}
  </button>
</mat-dialog-actions>
