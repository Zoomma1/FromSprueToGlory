<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Add Item' : 'Edit Item' }}</h2>
<mat-dialog-content>
    <form [formGroup]="form">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
        </mat-form-field>

        <div class="form-row">
            <app-searchable-select
                formControlName="gameSystem"
                [options]="gameSystems()"
                [displayFn]="gameSystemDisplayFn"
                label="Game System"
                (valueChange)="onGameSystemChange($event?.id ?? '')">
            </app-searchable-select>

            <app-searchable-select
                formControlName="faction"
                [options]="factions()"
                [displayFn]="factionDisplayFn"
                label="Faction">
            </app-searchable-select>
        </div>

        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Status</mat-label>
                <mat-select formControlName="status">
                  @for (status of ITEM_STATUSES; track status){
                    <mat-option [value]="status.value">{{status.label}}</mat-option>
                  }
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Quantity</mat-label>
                <input matInput type="number" formControlName="quantity" min="1">
            </mat-form-field>
        </div>

        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Price</mat-label>
                <input matInput type="number" formControlName="price" step="0.01">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Currency</mat-label>
                <mat-select formControlName="currency">
                  @for (cur of CURRENCIES; track cur){
                    <mat-option [value]="cur">{{ cur }}</mat-option>
                  }
                </mat-select>
            </mat-form-field>
        </div>

        <app-searchable-select
            formControlName="project"
            [options]="projects()"
            [displayFn]="projectDisplayFn"
            label="Project (optional)"
            nullOptionLabel="— None —">
        </app-searchable-select>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Notes</mat-label>
            <textarea matInput formControlName="notes" rows="3"></textarea>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || saving()">
        {{ data.mode === 'create' ? 'Create' : 'Save' }}
    </button>
</mat-dialog-actions>
